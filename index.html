<!DOCTYPE html>
<html lang="tk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AHMET Panel</title>
    <style>
        body {
            background-color: #0f0f12;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 5px;
        }
        .logo {
            background: #8b5cf6;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .title {
            font-size: 24px;
            font-weight: bold;
        }
        .subtitle {
            color: #9ca3af;
            font-size: 14px;
            margin-bottom: 20px;
        }
        .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        .btn {
            background-color: #1a1a24;
            color: #fff;
            border: 1px solid #2d2d3d;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            text-align: center;
        }
        .btn-purple {
            background-color: #8b5cf6;
            color: #fff;
            grid-column: span 2;
            font-weight: bold;
            padding: 15px;
        }
        .card {
            background-color: #161621;
            border: 1px solid #272738;
            border-radius: 14px;
            padding: 15px;
            margin-bottom: 12px;
        }
        .card-title {
            color: #9ca3af;
            font-size: 12px;
        }
        .card-value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 5px;
        }
        .status {
            color: #10b981;
            font-size: 14px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">☁️</div>
        <div class="title">AHMET Panel</div>
    </div>
    <div class="subtitle">Abonementleriňizi we konfigurasiýa baglanşyklaryňyzy dolandyryň</div>

    <div class="btn-group">
        <div class="btn">🚪 Hasapdan çyk</div>
        <div class="btn">⚙️ Sazlamalar</div>
        <div class="btn">🔄 Täzele</div>
        <div class="btn">⚡ Vpn kod düz</div>
        <div class="btn btn-purple">+ Täze abonement</div>
    </div>

    <div class="status">● Internet birikdi</div>

    <div class="card">
        <div class="card-title">BALANS</div>
        <div class="card-value">5 TMT</div>
    </div>

    <div class="card">
        <div class="card-title">Jemi abonement</div>
        <div class="card-value">0</div>
    </div>

    <div class="card">
        <div class="card-title">Işjeň</div>
        <div class="card-value">0</div>
    </div>

    <div class="card">
        <div class="card-title">Jemi konfig</div>
        <div class="card-value">0</div>
    </div>

</body>
  </html>
